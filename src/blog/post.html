<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta property="og:site_name" content="Fabiola Ledesma" />

  <meta id="og-description" property="og:description" content="" />
  <meta id="og-image" property="og:image" content="" />
  <meta id="og-url" property="og:url" content="" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- Marked.js for Markdown rendering -->

  <!-- DOMPurify for sanitizing rendered HTML -->

  <style>
    /* ── Post page styles ─────────────────────────────────────────── */
    .post-hero {
      background: linear-gradient(160deg, #2d0f18 0%, #A84F6F 60%, #C96A8A 100%);
      padding: 5rem 0 0;
      color: #fff;
    }
    .post-hero__inner {
      max-width: 56rem;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
    }
    .post-back {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      margin-bottom: 2rem;
      transition: color 0.15s;
    }
    .post-back:hover { color: #fff; }
    .post-back svg { width: 1rem; height: 1rem; }

    .post-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }
    .post-tag-hero {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 2rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #FAD4E3;
    }

    .post-title {
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1.25rem;
      font-family: 'Lora', Georgia, serif;
    }
    .post-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      font-size: 0.875rem;
      color: rgba(255,255,255,0.65);
    }
    .post-meta__author { display: flex; align-items: center; gap: 0.5rem; }
    .post-meta__avatar {
      width: 2rem; height: 2rem;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700; color: #fff;
    }
    .post-meta__sep { opacity: 0.4; }

    .post-cover {
      max-width: 56rem;
      margin: 0 auto;
      padding: 0 1.5rem;
      transform: translateY(2rem);
    }
    .post-cover img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      display: block;
    }

    /* Article body */
    .post-body-wrapper {
      max-width: 56rem;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr min(42rem, 100%) 1fr;
    }
    .post-body-wrapper > * { grid-column: 2; }

    .post-article {
      padding-top: 4rem;
      padding-bottom: 3rem;
    }

    /* Markdown content typography */
    .prose {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.0625rem;
      line-height: 1.8;
      color: #334155;
    }
    .prose h1,.prose h2,.prose h3,.prose h4 {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      color: #0f172a;
      margin-top: 2em;
      margin-bottom: 0.75em;
      line-height: 1.3;
    }
    .prose h1 { font-size: 1.875rem; }
    .prose h2 { font-size: 1.375rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.4em; }
    .prose h3 { font-size: 1.125rem; }
    .prose p { margin-bottom: 1.4em; }
    .prose a { color: #C96A8A; text-decoration: underline; text-underline-offset: 3px; }
    .prose a:hover { color: #A84F6F; }
    .prose strong { font-weight: 700; color: #0f172a; }
    .prose em { font-style: italic; }
    .prose ul,.prose ol { margin: 0 0 1.4em 1.5em; }
    .prose li { margin-bottom: 0.4em; }
    .prose blockquote {
      border-left: 4px solid #C96A8A;
      padding: 0.75em 1.25em;
      margin: 1.5em 0;
      background: #fff0f5;
      border-radius: 0 0.5rem 0.5rem 0;
      color: #A84F6F;
      font-style: italic;
    }
    .prose blockquote p { margin: 0; }
    .prose code {
      font-family: 'Fira Mono', 'Consolas', monospace;
      font-size: 0.875em;
      background: #f1f5f9;
      padding: 0.1em 0.4em;
      border-radius: 0.25em;
      color: #be185d;
    }
    .prose pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 1.25em 1.5em;
      border-radius: 0.75rem;
      overflow-x: auto;
      margin: 1.5em 0;
    }
    .prose pre code { background: none; color: inherit; padding: 0; }
    .prose img { max-width: 100%; border-radius: 0.5rem; margin: 1.5em 0; }
    .prose hr { border: none; border-top: 2px solid #e2e8f0; margin: 2.5em 0; }
    .prose table { width: 100%; border-collapse: collapse; margin: 1.5em 0; font-size: 0.9em; font-family: 'Inter', sans-serif; }
    .prose th { background: #f8fafc; font-weight: 600; color: #374151; }
    .prose th,.prose td { border: 1px solid #e2e8f0; padding: 0.625em 0.875em; text-align: left; }
    .prose tr:hover td { background: #f8fafc; }

    /* Share bar */
    .share-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 1.5rem 0;
      border-top: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 3rem;
    }
    .share-bar__label { font-size: 0.85rem; font-weight: 600; color: #64748b; margin-right: 0.25rem; font-family: 'Inter', sans-serif; }
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.875rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .share-btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .share-btn--whatsapp { background: #25D366; color: #fff; }
    .share-btn--linkedin { background: #0077B5; color: #fff; }
    .share-btn--twitter  { background: #0f172a; color: #fff; }
    .share-btn svg { width: 1rem; height: 1rem; }

    /* Related posts */
    .related-section {
      background: #f8fafc;
      padding: 3rem 0;
      margin-top: 1rem;
    }
    .related-inner {
      max-width: 56rem;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
    .related-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 1.5rem;
      font-family: 'Inter', sans-serif;
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }
    .related-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      overflow: hidden;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .related-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.07); }
    .related-card__cover {
      height: 130px;
      background: #fce4ee;
      background-size: cover;
      background-position: center;
      display: flex; align-items: center; justify-content: center;
    }
    .related-card__cover-ph { font-size: 1.5rem; font-weight: 800; color: #E8A0BA; }
    .related-card__body { padding: 1rem; }
    .related-card__title { font-size: 0.9rem; font-weight: 600; color: #1e293b; line-height: 1.4; margin-bottom: 0.375rem; font-family: 'Inter', sans-serif; }
    .related-card__date { font-size: 0.75rem; color: #94a3b8; font-family: 'Inter', sans-serif; }

    /* Loading / error states */
    .post-loading, .post-error {
      max-width: 56rem;
      margin: 6rem auto;
      padding: 0 1.5rem;
      text-align: center;
      font-family: 'Inter', sans-serif;
    }
    .post-loading__spinner {
      width: 3rem; height: 3rem;
      border: 3px solid #e2e8f0;
      border-top-color: #C96A8A;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .post-error h2 { font-size: 1.25rem; color: #1e293b; margin-bottom: 0.5rem; }
    .post-error p { color: #64748b; margin-bottom: 1.5rem; }
    .btn-back-blog {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1.25rem;
      background: #C96A8A;
      color: #fff;
      border-radius: 0.5rem;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn-back-blog:hover { background: #A84F6F; }

    /* Skeleton shimmer */
    .skel { background: linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%); background-size: 200% 100%; animation: skel 1.4s infinite; border-radius: 0.375rem; }
    @keyframes skel { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>

<script src="../js/main.js"></script>
<script>
(function () {
  'use strict';

  document.getElementById('footer-year').textContent = new Date().getFullYear();

  function getApiBase() {
    return (window.API_BASE_URL || '').replace(/\/$/, '');
  }

  function esc(str) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return String(str).replace(/[&<>"']/g, c => map[c]);
  }

  function formatDate(isoStr) {
    try {
      return new Date(isoStr).toLocaleDateString('es-MX', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch { return ''; }
  }

  function estimateReadTime(text) {
    const words = (text || '').split(/\s+/).length;
    return Math.max(1, Math.round(words / 200));
  }

  function renderMarkdown(md) {
    if (typeof marked === 'undefined') return `<p>${esc(md)}</p>`;
    const rawHtml = marked.parse(md || '', { breaks: true, gfm: true });
    if (typeof DOMPurify !== 'undefined') {
      return DOMPurify.sanitize(rawHtml, { USE_PROFILES: { html: true } });
    }
    return rawHtml;
  }

  function buildShareButtons(post) {
    const url = encodeURIComponent(window.location.href);
    const title = encodeURIComponent(post.title || '');
    const waText = encodeURIComponent(`${post.title} — ${window.location.href}`);
    const waNumber = (window.WHATSAPP_NUMBER || '').replace(/\D/g, '');

    return `
      <div class="share-bar">
        <span class="share-bar__label">Compartir:</span>
        <a
          href="https://wa.me/${waNumber}?text=${waText}"
          target="_blank" rel="noopener noreferrer"
          class="share-btn share-btn--whatsapp"
          aria-label="Compartir en WhatsApp"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
          WhatsApp
        </a>
        <a
          href="https://www.linkedin.com/shareArticle?mini=true&url=${url}&title=${title}"
          target="_blank" rel="noopener noreferrer"
          class="share-btn share-btn--linkedin"
          aria-label="Compartir en LinkedIn"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
          LinkedIn
        </a>
        <a
          href="https://twitter.com/intent/tweet?url=${url}&text=${title}"
          target="_blank" rel="noopener noreferrer"
          class="share-btn share-btn--twitter"
          aria-label="Compartir en X (Twitter)"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.259 5.631L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/>
          </svg>
          X
        </a>
      </div>`;
  }

  function buildRelatedCards(posts) {
    if (!posts || !posts.length) return '';
    return `
      <section class="related-section">
        <div class="related-inner">
          <h2 class="related-title">Artículos relacionados</h2>
          <div class="related-grid">
            ${posts.slice(0, 3).map(p => {
              const cover = p.coverImage || p.cover_image || '';
              return `
                <a href="./post.html?slug=${encodeURIComponent(p.slug || '')}" class="related-card">
                  <div class="related-card__cover" ${cover ? `style="background-image:url('${esc(cover)}')"` : ''}>
                    ${!cover ? '<span class="related-card__cover-ph">FL</span>' : ''}
                  </div>
                  <div class="related-card__body">
                    <p class="related-card__title">${esc(p.title || '')}</p>
                    <p class="related-card__date">${formatDate(p.publishedAt || p.created_at || '')}</p>
                  </div>
                </a>`;
            }).join('')}
          </div>
        </div>
      </section>`;
  }

  function renderPost(post, related) {
    const tags = Array.isArray(post.tags) ? post.tags : String(post.tags || '').split(',').map(t => t.trim()).filter(Boolean);
    const cover = post.coverImage || post.cover_image || '';
    const readTime = estimateReadTime(post.content || '');
    const author = post.author || 'Fabiola Ledesma';
    const date = formatDate(post.publishedAt || post.created_at || '');

    // Update document meta
    document.title = `${post.title || 'Artículo'} — Fabiola Ledesma`;
    document.querySelector('meta[name="description"]').setAttribute('content', post.excerpt || '');
    document.getElementById('og-title').setAttribute('content', post.title || '');
    document.getElementById('og-description').setAttribute('content', post.excerpt || '');
    document.getElementById('og-image').setAttribute('content', cover);
    document.getElementById('og-url').setAttribute('content', window.location.href);

    const root = document.getElementById('post-root');
    root.innerHTML = `
      <!-- Hero -->
      <header class="post-hero">
        <div class="post-hero__inner">
          <a href="./index.html" class="post-back">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Volver al blog
          </a>

          ${tags.length ? `<div class="post-tags">${tags.map(t => `<span class="post-tag-hero">${esc(t)}</span>`).join('')}</div>` : ''}

          <h1 class="post-title">${esc(post.title || '')}</h1>

          <div class="post-meta">
            <div class="post-meta__author">
              <div class="post-meta__avatar" aria-hidden="true">FL</div>
              <span>${esc(author)}</span>
            </div>
            ${date ? `<span class="post-meta__sep" aria-hidden="true">·</span><time datetime="${esc(post.publishedAt || post.created_at || '')}">${date}</time>` : ''}
            <span class="post-meta__sep" aria-hidden="true">·</span>
            <span>${readTime} min de lectura</span>
          </div>
        </div>
      </header>

      ${cover ? `
        <div class="post-cover" aria-hidden="true">
          <img src="${esc(cover)}" alt="${esc(post.title || '')}" loading="lazy" />
        </div>
      ` : '<div style="height:2rem;"></div>'}

      <!-- Body -->
      <div class="post-body-wrapper">
        <article class="post-article" ${cover ? 'style="padding-top:5rem;"' : ''}>
          <div class="prose" id="post-prose">
            ${renderMarkdown(post.content || '')}
          </div>
          ${buildShareButtons(post)}
          <div style="text-align:center;padding-bottom:1rem;">
            <a href="./index.html" class="btn-back-blog">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
              Volver al blog
            </a>
          </div>
        </article>
      </div>

      ${buildRelatedCards(related)}
    `;
  }

  function renderError(message) {
    document.getElementById('post-root').innerHTML = `
      <div class="post-error">
        <svg width="64" height="64" fill="none" viewBox="0 0 24 24" stroke="#cbd5e1" style="margin:0 auto 1rem;display:block;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <h2>Artículo no encontrado</h2>
        <p>${esc(message || 'No pudimos cargar este artículo.')}</p>
        <a href="./index.html" class="btn-back-blog">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          Ver todos los artículos
        </a>
      </div>`;
  }

  async function loadPost() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    if (!slug) {
      renderError('No se especificó ningún artículo.');
      return;
    }

    try {
      const [postRes, allRes] = await Promise.allSettled([
        fetch(`${getApiBase()}/blog/posts/${encodeURIComponent(slug)}`),
        fetch(`${getApiBase()}/blog/posts?published=true&limit=10`),
      ]);

      if (postRes.status === 'rejected' || !postRes.value.ok) {
        const msg = postRes.status === 'fulfilled'
          ? `Error ${postRes.value.status}`
          : 'Error de red';
        throw new Error(msg);
      }

      const post = await postRes.value.json();

      // Build related posts: same tags, excluding current
      let related = [];
      if (allRes.status === 'fulfilled' && allRes.value.ok) {
        const allData = await allRes.value.json();
        const all = Array.isArray(allData) ? allData : (allData.posts || allData.items || []);
        const postTags = new Set(
          (Array.isArray(post.tags) ? post.tags : String(post.tags || '').split(',')).map(t => t.trim().toLowerCase())
        );
        related = all
          .filter(p => p.slug !== slug)
          .sort((a, b) => {
            // Sort by tag overlap
            const aTags = (Array.isArray(a.tags) ? a.tags : String(a.tags || '').split(','))
              .filter(t => postTags.has(t.trim().toLowerCase())).length;
            const bTags = (Array.isArray(b.tags) ? b.tags : String(b.tags || '').split(','))
              .filter(t => postTags.has(t.trim().toLowerCase())).length;
            return bTags - aTags;
          })
          .slice(0, 3);
      }

      renderPost(post, related);
    } catch (err) {
      console.error('[Post] Load error:', err);
      renderError(err.message);
    }
  }

  loadPost();
})();
</script>
</body>
</html>
